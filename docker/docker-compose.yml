services:
  mongodb: # seperate machine
    image: mongo:7-jammy
    container_name: mongodb
    ports:
      - "27007:27017" # map 27017 (server) to 27007 (local)
    volumes:
      - mongodata:/data/db # persist data on host machine

    environment:
     - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
     - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

    networks:
      - backend
    
    restart: always

networks:
  backend:

volumes:
  mongodata: